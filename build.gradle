plugins {
	id 'java'
	id 'war'
	id 'org.springframework.boot' version '3.2.4'
	id 'io.spring.dependency-management' version '1.1.4'
}

bootJar {
	archiveFileName = 'coreService.jar'
}


war.enabled=false
bootWar.enabled=true

group = 'stackhub-core-service'
version = '0.0.1-SNAPSHOT'



java {
	sourceCompatibility = JavaVersion.VERSION_21
}

configurations {

	runtimeClasspath {
		extendsFrom developmentOnly
	}
	compileOnly {
		extendsFrom annotationProcessor
	}
}

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

tasks.withType(JavaExec) {
	environment 'LC_ALL', 'en_US.UTF-8'
}

repositories {
	mavenCentral()
}

ext {
	set('springModulithVersion', "1.1.2")
}

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-web-services'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'

	implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.postgresql:postgresql:9.4.1212'
	runtimeOnly 'org.postgresql:postgresql'

	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	annotationProcessor "com.querydsl:querydsl-apt:${dependencyManagement.importedProperties['querydsl.version']}:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"

	implementation 'com.querydsl:querydsl-codegen:4.4.0'
	implementation 'org.apache.commons:commons-lang3:3.12.0'
	implementation 'org.springframework:spring-web:6.1.5'

	implementation 'com.jcraft:jsch:0.1.55'

//	excel
	implementation 'org.apache.poi:poi:5.2.3'
	implementation 'org.apache.poi:poi-ooxml:5.2.3'
	implementation 'commons-net:commons-net:3.8.0'

	// google
	implementation 'com.drewnoakes:metadata-extractor:2.16.0'

	// sms

	implementation 'org.apache.httpcomponents.client5:httpclient5'
	implementation 'org.apache.httpcomponents.core5:httpcore5'
	implementation 'org.json:json:20210307'

	implementation 'org.apache.mina:mina-core:2.1.5'
	implementation 'org.apache.sshd:sshd-core:2.7.0'
	implementation 'org.apache.sshd:sshd-sftp:2.7.0'
	implementation 'org.apache.sshd:sshd-common:2.7.0'

	// security
//	implementation 'org.springframework.boot:spring-boot-starter-security'
}




dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
